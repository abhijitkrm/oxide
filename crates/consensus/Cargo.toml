# Oxide blockchain — `consensus` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "consensus"
description = "oxideBFT consensus engine — pipelined 2-chain HotStuff with an active pacemaker, BLS quorum certificates, and tail-fork resistance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
crypto = { workspace = true }
types = { workspace = true }
ports = { workspace = true }
# libc: `O_DSYNC` + `fallocate` for the WAL's data-synchronous,
# preallocated append path on Linux — no std exposure. Justified in
# the workspace manifest; no other libc surface is used.
libc = { workspace = true }

[features]
# Conformance mode: disables BLS signature verification for
# conformance suites and benchmarks that use fake keys. This feature
# must NEVER be enabled in production builds — it allows forged votes
# and QCs. The `without_signature_verification` method is gated
# behind `#[cfg(any(test, feature = "conformance"))]`.
conformance = []

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3"

[[bench]]
name = "engine"
harness = false
required-features = ["conformance"]

[lints]
workspace = true
