# Oxide blockchain — `executor` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "executor"
description = "Sequential block executor with module router — consumes finalized blocks, executes txs, produces state roots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
crypto = { workspace = true }
types = { workspace = true }
ports = { workspace = true }
mempool = { workspace = true }
metrics = { workspace = true }
# storage: for the `Snapshot` type used by the Module trait's
# `export_state`/`import_state` methods (full KV snapshot sync).
storage = { workspace = true }
# rayon: parallel secp256k1 recovery across batch intake — the
# envelope-recovery pass in `ingest_tx_batch` fans the ~43µs/tx
# recovery across cores (the EVM module's own preverify_batch uses
# the same workspace-pinned version for the same reason).
rayon = { workspace = true }

[dev-dependencies]
consensus = { workspace = true }
criterion = "0.7.0"
framework = { workspace = true }
# Integration tests sign fixtures as deterministic identities —
# the dev-dep enables crypto's gated surface for test builds only.
crypto = { workspace = true, features = ["dev-identities"] }
# Integration tests + benches register the real modules (staking
# settles through the EVM ledger — the single native-token store).
# Dev-dep cycles: `evm`/`staking` depend on `executor`; cargo builds
# the extern crates against the published lib, so no cycle forms.
evm = { workspace = true }
staking = { workspace = true }
# The `redb` feature gives durability tests a real disk-backed
# StorageBackend — the "EVM durable ahead of native modules" crash
# scenario only exists when the EVM's store survives the executor's
# drop. Features unify with the lib's own `storage` dep, so the lib
# itself is unaffected outside tests.
storage = { workspace = true, features = ["redb"] }
# tempfile: durability tests need real directories — the crash-
# recovery contract only exists over real filesystem state (the
# journal segments, snapshot.bin, and the EVM's redb store must
# survive the executor's drop).
tempfile = "3.27.0"

[[bench]]
name = "uniswap_transfer"
harness = false

[[bench]]
name = "block_pipeline"
harness = false

[lints]
workspace = true
