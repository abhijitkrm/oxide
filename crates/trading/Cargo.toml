# Oxide blockchain — `trading` crate
# (workspace: github.com/abhijitkrm/oxide; the crate name carries no
# `oxide-` prefix: see docs/devlog.md, session 2, for the convention)
#
# HFT-grade matching engine core (plan.md §9.1). Hot-path crate policy
# (production-rust skill §5): std-only at runtime — the single runtime
# dependency is `primitives` (internal, itself std-only), which supplies
# the deterministic fixed-point Price/Qty types. Everything else is
# dev-only (criterion benches, proptest properties).

[package]
name = "trading"
description = "HFT-grade central-limit-order-book matching engine: slab-arena order pool, dense tick-ladder book with hierarchical bitboard price discovery, strict price-time priority, and deterministic fill events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Deterministic fixed-point types (Price scale-8, Qty scale-6) and
# Address. The one internal dependency hot-path crates may share.
primitives = { workspace = true }

[dev-dependencies]
# Benchmark harness (criterion gates: plan.md §13 Phase 3 acceptance).
criterion = "0.7.0"
# Property-based oracle-equivalence testing (testing-standards skill,
# layer 2: matching ops == sequential model oracle).
proptest = "1.11.0"
# Bench-only: the fold-enabled rows call the exchange module's real
# `book_resting_leaf` (CanonicalState preimage + Domain::CommittedLeaf
# hash) so the measured fold cost is the production leaf, not a
# replica (hft-audit-2 F-26). Dev-dep cycle (exchange depends on
# trading) is legal for benches; runtime deps stay primitives-only —
# the engine takes the leaf as a function pointer and never sees the
# hasher.
exchange = { workspace = true }

[[bench]]
name = "matching"
harness = false

[lints]
workspace = true
