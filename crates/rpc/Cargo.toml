# Oxide blockchain — `rpc` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "rpc"
description = "Oxide JSON-RPC + WebSocket server — Ethereum-compatible RPC endpoints for MetaMask/Foundry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
types = { workspace = true }
evm = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# hex: hex encoding/decoding for RPC params (addresses, data, hashes).
# MIT/Apache-2.0 licensed.
hex = "0.4"
# sha3: keccak-256 for `web3_sha3` and tx hash computation.
# MIT/Apache-2.0 licensed. Already a transitive dep via revm.
sha3 = { workspace = true }

[lints]
workspace = true
