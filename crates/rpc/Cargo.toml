# Oxide blockchain — `rpc` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "rpc"
description = "Oxide JSON-RPC + WebSocket server — Ethereum-compatible RPC endpoints for MetaMask/Foundry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
types = { workspace = true }
evm = { workspace = true }
metrics = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# hex: hex encoding/decoding for RPC params (addresses, data, hashes).
# MIT/Apache-2.0 licensed.
hex = "0.4"
# sha3: keccak-256 for `web3_sha3` and tx hash computation.
# MIT/Apache-2.0 licensed. Already a transitive dep via revm.
sha3 = { workspace = true }
# alloy-primitives: B256/Address/U256 for block-tag, hash, and storage
# params. MIT/Apache-2.0 licensed. Same workspace pin the evm crate
# uses, so the types line up.
alloy-primitives = { workspace = true }
# tokio: async runtime for the HTTP server.
# MIT-licensed (GPL-3.0-compatible). Not on the hot path.
tokio = { workspace = true }
# axum: HTTP server framework for the JSON-RPC endpoint.
# MIT-licensed (GPL-3.0-compatible).
axum = { workspace = true }
# tower: service abstraction required by axum's serve().
# MIT-licensed (GPL-3.0-compatible).
tower = { workspace = true }
# hyper: low-level HTTP types (body reading).
# MIT-licensed (GPL-3.0-compatible).
hyper = { workspace = true }

[dev-dependencies]
# revm: needed only by tests that build and sign EVM transactions to
# exercise the `eth_sendRawTransaction` → mempool submission path.
# Already a transitive dep via evm; declared explicitly for direct use
# in test helpers. MIT/Apache-2.0 licensed.
revm = { workspace = true }
# executor: the `Module` trait lives here — needed by tests that drive
# `EvmModule::begin_block`/`end_block` to seal history entries.
executor = { workspace = true }
# tokio-tungstenite + futures-util: a real WebSocket client so the
# `eth_subscribe` tests exercise the actual transport (upgrade,
# frames, notifications) rather than the in-process dispatch shim.
# MIT-licensed; same workspace pins the matcher uses.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
