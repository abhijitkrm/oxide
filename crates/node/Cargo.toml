# Oxide blockchain — `node` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "node"
description = "Production node assembly — config-driven engine selection, module registration, and node lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forward `crypto`'s deterministic-identity surface for the devnet
# assembly helpers (`cli::build_signed_tx`, the `None`-genesis
# funded signer identity). Dev tooling enables it; production
# binaries (`oxide-validator`, `oxide-matcher`, `oxide-fullnode`)
# do not, so their dependency graph has no derivable signing path.
dev-identities = ["crypto/dev-identities"]
# Passphrase-encrypted key files (`crypto::keystore`) — the key-file
# loaders gain decryption support. Enabled by binaries that read
# operator key material (`oxide-validator`, `oxide-devnet`,
# `oxide-matcher`).
keystore = ["crypto/keystore"]

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
config = { workspace = true }
crypto = { workspace = true }
types = { workspace = true }
ports = { workspace = true }
consensus = { workspace = true }
executor = { workspace = true }
framework = { workspace = true }
oxide-core = { workspace = true }
staking = { workspace = true }
evm = { workspace = true }
exchange = { workspace = true }
perps = { workspace = true }
oracle = { workspace = true }
governance = { workspace = true }
trading = { workspace = true }
storage = { workspace = true, features = ["redb"] }
rpc = { workspace = true }
# p2p: `PeerAuth` impl for the transport's signed greeting — the
# node assembly layer binds peer IDs to consensus keys. The `tls`
# feature is on unconditionally: `validator_net` is the production
# networked-validator pump, and mTLS must exist in every binary that
# can run it (the posture gate decides when it is *required*).
p2p = { workspace = true, features = ["tls"] }
# tokio: the RPC HTTP server runs on a dedicated current-thread
# runtime spawned by `validator_net`'s `start_rpc`.
tokio = { workspace = true }
# alloy-primitives: `B256` appears in the rpc crate's public API
# (`record_pending_tx`) — already a transitive dep via revm/evm, so
# this adds nothing to the compiled graph.
alloy-primitives = { workspace = true }
# tracing: structured diagnostic logging for node lifecycle events
# (startup, shutdown, block finalization). Not on the hot path.
tracing = { workspace = true }
metrics.workspace = true

[dev-dependencies]
criterion = "0.7.0"
framework = { workspace = true }
types = { workspace = true }
primitives = { workspace = true }
# Unit tests build committees over the deterministic identities —
# the dev-dep turns the crypto feature on for test builds only.
crypto = { workspace = true, features = ["dev-identities"] }

[[bench]]
name = "node_assembly"
harness = false

[[bench]]
name = "sustained_throughput"
harness = false

[lints]
workspace = true
