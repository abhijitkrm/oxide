# Oxide blockchain — `storage` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "storage"
description = "Oxide storage engine: append-only CRC'd journal (group commit), Merkle Mountain Range over leaf hashes, and the StorageBackend seam with an in-memory reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared type vocabulary (Hash keys, per plan.md §8 sizing). Internal,
# hot-path-approved dependency — the same one `codec` uses.
primitives = { workspace = true }
# BLAKE3 is the consensus hash (docs/storage-spec.md §3). Justification
# (production-rust skill §5): collision resistance is non-negotiable for
# an authenticated data structure, implementing our own would be
# negligent, and blake3 is mature/pinned. The journal *core* (segments,
# CRC-32, replay) stays std-only; only the merkle layer touches this.
blake3 = "1"

[dev-dependencies]
criterion = "0.7.0"
proptest = "1"
# Integration test for journal replay (Phase 1 acceptance gate):
# write finalized blocks to the journal, replay them, re-execute
# through the real executor + modules, and verify the state root
# matches bit-exact.
#
# NOTE: the `core` module crate is renamed to `oxide_core` here because
# a dependency named `core` shadows Rust's `core` crate, which breaks
# proptest's `proptest!` macro (it internally references `::core::concat!`
# etc.). The devnet crate can use `core` directly because it doesn't
# depend on proptest.
executor = { workspace = true }
consensus = { workspace = true }
codec = { workspace = true }
types = { workspace = true }
framework = { workspace = true }
oxide_core = { package = "core", path = "../../modules/core", version = "0.1.0" }
bank = { workspace = true }
staking = { workspace = true }
ports = { workspace = true }

[[bench]]
name = "journal"
harness = false

[[bench]]
name = "mmr"
harness = false

[lints]
workspace = true
