# Oxide blockchain — `storage` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "storage"
description = "Oxide storage engine: append-only CRC'd journal (group commit), Merkle Mountain Range over leaf hashes, and the StorageBackend seam with an in-memory reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared type vocabulary (Hash keys, per plan.md §8 sizing). Internal,
# hot-path-approved dependency — the same one `codec` uses.
primitives = { workspace = true }
# Codec: Encode/Decode for Snapshot serialization (save/load/RPC).
codec = { workspace = true }
# Crypto: domain-separated hashing for state roots in the
# JournalBackend. Internal crate, hot-path-approved.
crypto = { workspace = true }
# BLAKE3 is the consensus hash (docs/storage-spec.md §3). Justification
# (production-rust skill §5): collision resistance is non-negotiable for
# an authenticated data structure, implementing our own would be
# negligent, and blake3 is mature/pinned. The journal *core* (segments,
# CRC-32, replay) stays std-only; only the merkle layer touches this.
blake3 = "1"
# redb: pure-Rust ACID embedded KV store (plan.md §2.3 StorageBackend
# adapter). Optional, behind the "redb" feature, so the default build
# stays dependency-light. Apache-2.0 (GPL-3.0-compatible).
redb = { workspace = true, optional = true }
# RocksDB: industry-standard LSM KV store (plan.md §2.3 StorageBackend
# adapter). Optional, behind the "rocksdb" feature. Apache-2.0
# (GPL-3.0-compatible). C++ binding — requires a C++ compiler.
rocksdb = { workspace = true, optional = true }
# libmdbx: idiomatic Rust wrapper for MDBX (LMDB-compatible,
# improved). Optional, behind the "mdbx" feature. MPL-2.0
# (GPL-3.0-compatible). C binding.
libmdbx = { workspace = true, optional = true }

[features]
default = []
# Enable the redb StorageBackend adapter.
redb = ["dep:redb"]
# Enable the RocksDB StorageBackend adapter.
rocksdb = ["dep:rocksdb"]
# Enable the MDBX StorageBackend adapter.
mdbx = ["dep:libmdbx"]

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.11.0"
# Integration test for journal replay (Phase 1 acceptance gate):
# write finalized blocks to the journal, replay them, re-execute
# through the real executor + modules, and verify the state root
# matches bit-exact.
#
# The `oxide-core` module crate (package `oxide-core`, crate name
# `oxide_core`) was previously named `core`, which shadowed Rust's
# `core` crate and broke proptest's `proptest!` macro (it internally
# references `::core::concat!` etc.). The rename to `oxide-core`
# (L2 fix) eliminates the collision entirely.
executor = { workspace = true }
consensus = { workspace = true }
codec = { workspace = true }
types = { workspace = true }
framework = { workspace = true }
oxide-core = { workspace = true }
staking = { workspace = true }
# The EVM module supplies the ledger (account store) the staking
# module settles through — there is no bank module.
evm = { workspace = true }
ports = { workspace = true }
tempfile = "3.27.0"

[[bench]]
name = "journal"
harness = false

[[bench]]
name = "mmr"
harness = false

[[bench]]
name = "backend"
harness = false

[lints]
workspace = true
