# Oxide blockchain — `matcher` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "matcher"
description = "Off-chain matching server — runs the trading engine directly, accepts orders via binary TCP, WebSocket, JSON-RPC, and FIX, batches fills for on-chain settlement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
types = { workspace = true }
trading = { workspace = true }
exchange = { workspace = true }
framework = { workspace = true }
executor = { workspace = true }
ports = { workspace = true }
crypto = { workspace = true }
# serde: JSON serialization for JSON-RPC and WebSocket protocols.
# MIT/Apache-2.0 licensed.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio: async runtime for the network servers.
# MIT-licensed (GPL-3.0-compatible). Not on the consensus hot path.
tokio = { workspace = true }
# tokio-tungstenite: async WebSocket server for the WebSocket
# order-entry protocol. MIT-licensed (GPL-3.0-compatible).
tokio-tungstenite = { workspace = true }
# futures-util: Stream/Sink traits for async WebSocket I/O.
futures-util = { workspace = true }
# crossbeam-channel: lock-free bounded channel for the SPSC rings.
# Replaces std::sync::mpsc + Mutex with a truly lock-free channel.
# MIT/Apache-2.0 licensed (GPL-3.0-compatible).
crossbeam-channel = { workspace = true }

[dev-dependencies]
criterion = "0.7.0"
# hex: hex encoding for test/benchmark address formatting.
# MIT/Apache-2.0 licensed.
hex = "0.4"

[lints]
workspace = true

[[bench]]
name = "matcher_throughput"
harness = false

[[bench]]
name = "balance_contention"
harness = false

[[bench]]
name = "nonce_contention"
harness = false

# Per-op allocation accounting on the action/match/API surfaces
# (audit001 §7.5). Dedicated binary: its counting GlobalAlloc must
# never skew the timing benches.
[[bench]]
name = "alloc_accounting"
harness = false
