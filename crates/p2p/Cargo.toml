# Oxide blockchain — `p2p` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "p2p"
description = "Oxide transport implementations: in-process MeshTransport for deterministic devnet/sim, TCP transport with optional TLS for production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# TLS support for the TCP transport. Enables rustls + ring for
# encrypted, authenticated peer connections. Disabled by default for
# local devnet/sim; enable with `--features p2p/tls` for production.
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:rcgen"]

[dependencies]
ports = { workspace = true }
primitives = { workspace = true }
thiserror = { workspace = true }
# socket2: setsockopt access (SO_SNDBUF/SO_RCVBUF) std doesn't
# expose — socket buffers are sized for the consensus message rate
# so a kernel-default 128 KiB buffer can't truncate bursts into
# retransmits (hft-audit F-10). MIT/Apache-2.0, already in the
# workspace lock tree.
socket2 = "=0.6.5"
# TLS dependencies (only active with the `tls` feature).
# rustls: pure-Rust TLS implementation (Apache-2.0/MIT/ISC, GPL-3.0-compatible).
# Uses the `aws_lc_rs` crypto provider (default for rustls 0.23, FIPS-compatible).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }
# rustls-pemfile: parse PEM-encoded certificates and keys for loading
# production TLS configs from files.
rustls-pemfile = { version = "2", optional = true }
# rcgen: generate self-signed X.509 certificates for devnet/testnet.
# Used by `TlsConfig::self_signed()` — production loads certs from files.
# Uses `aws_lc_rs` for crypto to match rustls's provider (avoids
# signature verification mismatches between signing and verification).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"], optional = true }

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "transport"
harness = false

# TLS reader/writer contention — split-half discipline vs the TCP
# baseline (audit001 §7.5). Only exists when rustls is compiled in.
[[bench]]
name = "tls_contention"
harness = false
required-features = ["tls"]

[lints]
workspace = true
