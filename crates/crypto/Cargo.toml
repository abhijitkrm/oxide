# Oxide blockchain — `crypto` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "crypto"
description = "Cryptographic primitives for Oxide: domain-separated BLAKE3 hashing and BLS12-381 signature type stubs for oxideBFT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
# BLAKE3 is the chain's hash function (plan.md §3). Pinned, mature,
# GPL-3.0-compatible (Apache-2.0). The crypto crate owns the
# domain-separated hashing API so storage and consensus share one
# implementation rather than each inlining blake3 calls.
blake3 = "1"
blst = "0.3.17"
# secp256k1: ECDSA signature recovery for EVM transactions (Phase A).
# Already a transitive dep via revm; declared explicitly here with the
# features we need. This is reth's exact choice — the C-vetted
# libsecp256k1 binding. MIT-0 licensed (GPL-3.0-compatible).
# Features: global-context (thread-safe global context), recovery
# (ecdsa recover for sender recovery from signed txs), rand (test
# signing key generation).
secp256k1 = { workspace = true }
# sha3: Keccak-256 for EVM tx hashing and address derivation (Phase A).
# Already a transitive dep via revm. The `sha3` crate's `Keccak256`
# digest is Ethereum's keccak256 (not NIST SHA3-256). MIT/Apache-2.0.
sha3 = { workspace = true }
# ed25519-dalek: Ed25519 signatures for native module authenticity
# (Phase G). Pure Rust, constant-time. BSD-3-Clause. Used for
# signing native (non-EVM) transactions: staking, exchange, perps.
ed25519-dalek = { workspace = true }

[features]
# Deterministic test identities (`secp::test_identity_key`,
# `secp::test_identity_address`) — publicly derivable secp256k1
# secrets shared by devnet/sim/fuzz tooling. Off by default so a
# production binary's dependency graph contains no derivable
# signing path; dev tooling and test builds opt in explicitly.
# `secp::is_test_identity_key` stays ungated — it is the refusal
# predicate the production startup policy uses to reject these
# keys.
dev-identities = []

[lints]
workspace = true

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "bls"
harness = false

[[bench]]
name = "tx_recover"
harness = false
