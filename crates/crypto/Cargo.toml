# Oxide blockchain — `crypto` crate
# (workspace: github.com/abhijitkrm/oxide; bare-name convention per
# docs/devlog.md session 2)

[package]
name = "crypto"
description = "Cryptographic primitives for Oxide: domain-separated BLAKE3 hashing and BLS12-381 signature type stubs for oxideBFT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
# BLAKE3 is the chain's hash function (plan.md §3). Pinned, mature,
# GPL-3.0-compatible (Apache-2.0). The crypto crate owns the
# domain-separated hashing API so storage and consensus share one
# implementation rather than each inlining blake3 calls.
blake3 = "1"
blst = "0.3.17"
# secp256k1: ECDSA signature recovery for EVM transactions (Phase A).
# Already a transitive dep via revm; declared explicitly here with the
# features we need. This is reth's exact choice — the C-vetted
# libsecp256k1 binding. MIT-0 licensed (GPL-3.0-compatible).
# Features: global-context (thread-safe global context), recovery
# (ecdsa recover for sender recovery from signed txs), rand (test
# signing key generation).
secp256k1 = { workspace = true }
# keccak-asm: Keccak-256 for EVM tx hashing and address derivation —
# the CRYPTOGAMS assembly permutation (hft-audit-2 S-9; replaced the
# pure-Rust `sha3` crate on this path). Zero new crates:
# alloy-primitives' `asm-keccak` feature already links this exact
# version into the node (see Cargo.lock). BSD-3-Clause.
keccak-asm = { workspace = true }
# ed25519-dalek: Ed25519 signatures for native module authenticity
# (Phase G). Pure Rust, constant-time. BSD-3-Clause. Used for
# signing native (non-EVM) transactions: staking, exchange, perps.
ed25519-dalek = { workspace = true }
# aws-lc-rs: PBKDF2 + AES-256-GCM for the `keystore` module — already
# the TLS crypto provider (rustls's `aws_lc_rs` feature), so this is
# a zero-new-crate edge: the version is pinned to the lockfile's.
# Optional so pure-Rust consumers (sim, fuzz, in-process harnesses)
# never pull the C toolchain through crypto.
aws-lc-rs = { version = "=1.18.1", optional = true }
# zeroize: memory hygiene for secrets — keystore plaintext/derived
# keys, decoded key buffers, secp256k1 intermediates. blst already
# zeroizes its SecretKey on drop; this covers the buffers around it.
zeroize = { workspace = true }

[features]
# Deterministic test identities (`secp::test_identity_key`,
# `secp::test_identity_address`) — publicly derivable secp256k1
# secrets shared by devnet/sim/fuzz tooling. Off by default so a
# production binary's dependency graph contains no derivable
# signing path; dev tooling and test builds opt in explicitly.
# `secp::is_test_identity_key` stays ungated — it is the refusal
# predicate the production startup policy uses to reject these
# keys.
dev-identities = []
# Passphrase-encrypted key files (`keystore` module) — PBKDF2 +
# AES-256-GCM via aws-lc-rs. Enabled by binaries that load operator
# key material; off for harnesses that never touch key files.
keystore = ["dep:aws-lc-rs"]

[lints]
workspace = true

[dev-dependencies]
criterion = "0.7.0"
# sha3: the pure-Rust keccak256 reference the asm implementation is
# pinned against (`keccak256_matches_reference_vectors`).
sha3 = { workspace = true }

[[bench]]
name = "hash"
harness = false

[[bench]]
name = "bls"
harness = false

[[bench]]
name = "tx_recover"
harness = false
