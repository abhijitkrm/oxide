# Oxide blockchain — `evm` module
# (workspace: github.com/abhijitkrm/oxide; bare-name convention)

[package]
name = "evm"
description = "EVM module — revm host, precompiles, EIP-1559 gas metering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
primitives = { workspace = true }
codec = { workspace = true }
crypto = { workspace = true }
types = { workspace = true }
executor = { workspace = true }
framework = { workspace = true }
revm = { workspace = true }
storage = { workspace = true }
# alloy-rlp: Ethereum RLP encoding for signed tx types (Phase A).
# Already a transitive dep via revm/alloy-primitives. MIT-licensed.
alloy-rlp = { workspace = true }
# alloy-trie: Merkle-Patricia Trie for Ethereum-compatible state roots
# (Phase B). Same alloy ecosystem as revm. The `ethereum` feature
# enables TrieAccount and state_root_unhashed. MIT/Apache-2.0.
alloy-trie = { workspace = true }
# alloy-primitives: core Ethereum types (B256, Address, U256, keccak256).
# Already a transitive dep via revm; declared explicitly for direct use
# in the trie and tx modules. MIT/Apache-2.0.
alloy-primitives = { workspace = true }
# rayon: parallel secp256k1 sender recovery in `handle_batch`.
# 88% of per-tx cost is ECDSA recovery; parallelizing across cores
# turns that into 88%/N_cores. MIT/Apache-2.0.
rayon = { workspace = true }

[dev-dependencies]
criterion = "0.7.0"
ports = { workspace = true }
consensus = { workspace = true }

[[bench]]
name = "fee"
harness = false

[[bench]]
name = "trie_root"
harness = false

[[bench]]
name = "tps_rw"
harness = false

[[bench]]
name = "breakdown"
harness = false

[lints]
workspace = true
