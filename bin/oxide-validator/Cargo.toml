# Oxide blockchain — `oxide-validator` binary
# (workspace: github.com/abhijitkrm/oxide)

[package]
name = "oxide-validator"
description = "Validator node binary — runs the full consensus + executor stack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxide-validator"
path = "src/main.rs"

[dependencies]
node = { workspace = true }
primitives = { workspace = true }
types = { workspace = true }
ports = { workspace = true }
framework = { workspace = true }
bank = { workspace = true }
config = { workspace = true }
crypto = { workspace = true }
consensus = { workspace = true }
executor = { workspace = true }
# TLS enabled for production validator connections (mTLS per C4).
# The `tls` feature is mandatory for the validator binary — a public
# testnet cannot run without encrypted, authenticated peer connections.
p2p = { workspace = true, features = ["tls"] }
oxide-core = { workspace = true }
staking = { workspace = true }
# evm: registered into the devnet executor so `eth_*` RPCs serve real
# state/history in multi-node mode.
evm = { workspace = true }
# alloy-primitives: U256 for parsing genesis `evm.alloc` storage slots.
alloy-primitives = { workspace = true }
rpc = { workspace = true }
codec = { workspace = true }
tokio = { workspace = true }
metrics = { workspace = true }
toml = "0.8"
# tracing + tracing-subscriber: structured diagnostic logging and the
# default fmt subscriber for node startup/shutdown lifecycle events.
# The subscriber is initialized at startup with `EnvFilter` for
# `RUST_LOG`-based log-level control.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
