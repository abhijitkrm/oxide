# Oxide blockchain — `oxide-fullnode` binary
# (workspace: github.com/abhijitkrm/oxide)

[package]
name = "oxide-fullnode"
description = "Full node binary — runs the executor + modules without consensus (read-only follower)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxide-fullnode"
path = "src/main.rs"

[dependencies]
node = { workspace = true }
config = { workspace = true }
# statesync/codec/executor/primitives: `--state-sync` bootstrap —
# manifest fetch, chunked download, snapshot decode + import.
statesync = { workspace = true }
codec = { workspace = true }
executor = { workspace = true }
primitives = { workspace = true }
# consensus/types/crypto: certificate-verified state sync — the
# `--trusted-validators` checkpoint builds a `ValidatorSet` and
# `consensus::verify_exec_cert` checks the served
# `types::ExecCertificate`'s quorum signature over it; the follower's
# observer key signs the peer-handshake proof.
consensus = { workspace = true }
types = { workspace = true }
crypto = { workspace = true }
# evm: the genesis-alloc hook applies `evm.alloc` to the assembled
# module; alloy-primitives supplies the U256 storage-slot type (the
# `node` crate deliberately avoids it — binaries own the parse).
evm = { workspace = true }
alloy-primitives = { workspace = true }
# tokio: SIGINT/SIGTERM handling for the follower pump — a
# current-thread runtime in the supervised signal thread, same
# pattern as oxide-validator/oxide-devnet.
tokio = { workspace = true }

[lints]
workspace = true
