# Oxide blockchain — `oxide-matcher` binary
# (workspace: github.com/abhijitkrm/oxide)

[package]
name = "oxide-matcher"
description = "Off-chain matching server binary — runs the trading engine, accepts orders via binary TCP/WS/JSON-RPC/FIX, batches fills for on-chain settlement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oxide-matcher"
path = "src/main.rs"

[dependencies]
matcher = { workspace = true }
# keystore: `--settlement-key-file` accepts encrypted OXKEY blobs.
node = { workspace = true, features = ["keystore"] }
primitives = { workspace = true }
types = { workspace = true }
trading = { workspace = true }
exchange = { workspace = true }
framework = { workspace = true }
executor = { workspace = true }
ports = { workspace = true }
# crypto: secp256k1 key→address derivation for --settlement-key.
crypto = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Unit tests generate deterministic identity keys; production code
# only ever *refuses* them (`is_test_identity_key`), so the feature
# stays a test-only dependency edge.
crypto = { workspace = true, features = ["dev-identities"] }

[lints]
workspace = true
