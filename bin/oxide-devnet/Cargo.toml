[package]
name = "oxide-devnet"
description = "Development multi-validator node — the devnet launcher binary, separated from the production oxide-validator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[[bin]]
name = "oxide-devnet"
path = "src/main.rs"
[dependencies]
# devnet is the development binary — it funds derivable fixture
# identities and signs smoke transactions as them, so it opts into
# the dev-identities surface on both `node` and `crypto`. `keystore`
# lets `--bls-key-file` accept encrypted operator key files too.
node = { workspace = true, features = ["dev-identities", "keystore"] }
primitives = { workspace = true }
framework = { workspace = true }
config = { workspace = true }
crypto = { workspace = true, features = ["dev-identities"] }
consensus = { workspace = true }
staking = { workspace = true }
evm = { workspace = true }
alloy-primitives = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
[lints]
workspace = true
