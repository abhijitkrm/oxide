[workspace]
resolver = "3"
# NOTE: add "modules/*" back to `members` the moment that directory
# gets its first crate — cargo errors on globs that match nothing,
# so the list below tracks what actually exists.
members = ["crates/*", "modules/*", "bin/*"]

# NOTE: `fuzz/` is intentionally NOT a workspace member — cargo-fuzz targets
# require a nightly toolchain and their own build graph. Build them with
# `cargo +nightly fuzz run <target>` from the `fuzz/` directory.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/abhijitkrm/oxide"

[workspace.lints.rust]
# A production financial system: unsafe is a reviewed, budgeted resource
# (see .devin/skills/production-rust, §4). Arena/huge-page crates opt back in
# with `#[allow(unsafe_code)]` + SAFETY comments.
unsafe_code = "deny"
missing_docs = "warn"
# Lint *groups* must run at lower priority than individual lints, else
# clippy warns about ambiguous precedence (bug f in docs/devlog.md).
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `must_use` on getters that are cheap copies adds call-site noise without
# catching real bugs in this codebase; reviewers enforce intent via docs.
must_use_candidate = "allow"
# Our types are small and pervasive (Hash, Height, View); pass-by-value is
# deliberate on hot paths. (Correct lint name: needless_pass_by_value —
# a first typo as need_pass_by_value surfaced as an unknown-lint warning.)
needless_pass_by_value = "allow"

[workspace.dependencies]
# Internal crates: path + exact version. The version is required by
# cargo-deny's `wildcards = "deny"` (a bare `{ path = ... }` is a
# wildcard) and keeps the graph deterministic and reviews local.
primitives = { path = "crates/primitives", version = "0.1.0" }
codec = { path = "crates/codec", version = "0.1.0" }
crypto = { path = "crates/crypto", version = "0.1.0" }
runtime = { path = "crates/runtime", version = "0.1.0" }
types = { path = "crates/types", version = "0.1.0" }
ports = { path = "crates/ports", version = "0.1.0" }
consensus = { path = "crates/consensus", version = "0.1.0" }
mempool = { path = "crates/mempool", version = "0.1.0" }
executor = { path = "crates/executor", version = "0.1.0" }
framework = { path = "modules/framework", version = "0.1.0" }
core = { path = "modules/core", version = "0.1.0" }
bank = { path = "modules/bank", version = "0.1.0" }
staking = { path = "modules/staking", version = "0.1.0" }
broadcast = { path = "crates/broadcast", version = "0.1.0" }
devnet = { path = "crates/devnet", version = "0.1.0" }

[profile.release]
# Whole-program optimization for the hot paths; slower builds are acceptable
# because perf gates (README.md → Roadmap) are release-profile measurements.
lto = "thin"
codegen-units = 1
panic = "unwind" # consensus must never abort silently; panics are caught at actor boundaries

[profile.bench]
debug = true # flamegraphs need symbols
