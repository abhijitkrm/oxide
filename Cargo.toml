[workspace]
resolver = "3"
# NOTE: add "modules/*" back to `members` the moment that directory
# gets its first crate — cargo errors on globs that match nothing,
# so the list below tracks what actually exists.
members = ["crates/*", "modules/*", "bin/*", "sim"]

# NOTE: `fuzz/` is intentionally NOT a workspace member — cargo-fuzz targets
# require a nightly toolchain and their own build graph. Build them with
# `cargo +nightly fuzz run <target>` from the `fuzz/` directory.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/abhijitkrm/oxide"

[workspace.lints.rust]
# A production financial system: unsafe is a reviewed, budgeted resource
# (see .devin/skills/production-rust, §4). Arena/huge-page crates opt back in
# with `#[allow(unsafe_code)]` + SAFETY comments.
unsafe_code = "deny"
missing_docs = "warn"
# Lint *groups* must run at lower priority than individual lints, else
# clippy warns about ambiguous precedence (bug f in docs/devlog.md).
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `must_use` on getters that are cheap copies adds call-site noise without
# catching real bugs in this codebase; reviewers enforce intent via docs.
must_use_candidate = "allow"
# Our types are small and pervasive (Hash, Height, View); pass-by-value is
# deliberate on hot paths. (Correct lint name: needless_pass_by_value —
# a first typo as need_pass_by_value surfaced as an unknown-lint warning.)
needless_pass_by_value = "allow"

[workspace.dependencies]
# Internal crates: path + exact version. The version is required by
# cargo-deny's `wildcards = "deny"` (a bare `{ path = ... }` is a
# wildcard) and keeps the graph deterministic and reviews local.
primitives = { path = "crates/primitives", version = "0.1.0" }
codec = { path = "crates/codec", version = "0.1.0" }
crypto = { path = "crates/crypto", version = "0.1.0" }
runtime = { path = "crates/runtime", version = "0.1.0" }
types = { path = "crates/types", version = "0.1.0" }
ports = { path = "crates/ports", version = "0.1.0" }
consensus = { path = "crates/consensus", version = "0.1.0" }
mempool = { path = "crates/mempool", version = "0.1.0" }
executor = { path = "crates/executor", version = "0.1.0" }
framework = { path = "modules/framework", version = "0.1.0" }
oxide-core = { path = "modules/oxide-core", version = "0.1.0" }
bank = { path = "modules/bank", version = "0.1.0" }
staking = { path = "modules/staking", version = "0.1.0" }
evm = { path = "modules/evm", version = "0.1.0" }
governance = { path = "modules/governance", version = "0.1.0" }
# RPC server (plan.md §13: JSON-RPC + WebSocket for MetaMask/Foundry).
rpc = { path = "crates/rpc", version = "0.1.0" }
# Indexer/explorer (plan.md §13: indexes finalized blocks for explorer).
indexer = { path = "crates/indexer", version = "0.1.0" }
broadcast = { path = "crates/broadcast", version = "0.1.0" }
p2p = { path = "crates/p2p", version = "0.1.0" }
devnet = { path = "crates/devnet", version = "0.1.0" }
storage = { path = "crates/storage", version = "0.1.0" }
config = { path = "crates/config", version = "0.1.0" }

# External EVM stack (plan.md §2: revm is the approved EVM engine).
# revm is MIT-licensed (GPL-3.0-compatible). Pinned exact version
# per AGENTS.md dependency policy.
revm = "42.0.1"

# thiserror: ergonomic error enums (used across infrastructure crates).
# MIT-OR-APACHE-2.0 licensed (GPL-3.0-compatible).
thiserror = "2"

# secp256k1: ECDSA signature recovery for EVM transactions (Phase A).
# Already a transitive dep via revm; declared explicitly with the
# features we need. This is reth's exact choice — the C-vetted libsecp256k1
# binding, ~2-3x faster than pure-Rust k256. MIT-0 licensed.
# Features: global-context (thread-safe global context, no per-call init),
# recovery (ecdsa recover), rand (test signing key generation).
secp256k1 = { version = "0.31.1", features = ["global-context", "recovery", "rand"] }

# alloy-rlp: Ethereum RLP encoding/decoding (Phase A signed tx types).
# Already a transitive dep via revm/alloy-primitives. MIT-licensed.
# Used for signed EVM transaction envelopes (Legacy, EIP-2930, EIP-1559).
alloy-rlp = "0.3.16"

# sha3: Keccak-256 hashing for EVM transactions and address derivation
# (Phase A). Already a transitive dep via revm. The `sha3` crate's
# `Keccak256` digest is Ethereum's keccak256 (not NIST SHA3-256 —
# the padding differs). MIT/Apache-2.0 licensed.
sha3 = "0.11.0"

# alloy-trie: Merkle-Patricia Trie state root calculator and proof
# generator (Phase B). Same alloy ecosystem as revm (B256, alloy-rlp,
# nybbles). Used by foundry/reth tooling. MIT/Apache-2.0 licensed.
# The `ethereum` feature enables `TrieAccount` and `state_root_unhashed`.
# This is the Ethereum-compatible MPT — replaces the sorted-account
# BLAKE3 hash with a proper keccak MPT root matching reth/mainnet.
alloy-trie = { version = "0.9.5", features = ["ethereum"] }

# alloy-primitives: core Ethereum types (B256, Address, U256, keccak256).
# Already a transitive dep via revm; declared explicitly for direct use
# in the EVM module (trie, tx types). MIT/Apache-2.0 licensed.
alloy-primitives = { version = "1.0", features = ["std"] }

# ed25519-dalek: Ed25519 signatures for native module authenticity
# (Phase G). Pure Rust, constant-time, no_std-compatible. Used by
# Solana, Signal, and many blockchain projects. BSD-3-Clause
# (GPL-3.0-compatible). This is the native signature scheme for
# Oxide's non-EVM modules (bank, staking, trading) — faster
# verification than secp256k1 and no malleability.
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
# rayon: data-parallelism for batch secp256k1 sender recovery.
# The EVM tx hot path spends 88% of its time on secp256k1 ECDSA
# recovery. Recovering N senders in parallel across cores turns
# that 88% into 88%/N_cores. MIT/Apache-2.0. Work-stealing
# threadpool, mature, used by reth/Foundry.
rayon = "1.12"

# External storage adapters (plan.md §2.3: StorageBackend adapters).
# redb is Apache-2.0 (GPL-3.0-compatible), pure Rust, ACID, LMDB-like.
redb = "4.2.0"
# RocksDB is Apache-2.0 (GPL-3.0-compatible), the industry-standard
# LSM KV store. C++ binding via the official `rocksdb` crate.
rocksdb = "0.24.0"
# libmdbx is MPL-2.0 (GPL-3.0-compatible), the idiomatic Rust
# wrapper for MDBX (LMDB-compatible, improved). C binding.
libmdbx = "0.6.6"

[profile.release]
# Whole-program optimization for the hot paths; slower builds are acceptable
# because perf gates (README.md → Roadmap) are release-profile measurements.
lto = "thin"
codegen-units = 1
panic = "unwind" # consensus must never abort silently; panics are caught at actor boundaries

[profile.bench]
debug = true # flamegraphs need symbols
