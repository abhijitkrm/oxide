# Oxide testnet configuration — public testnet with WAN-optimized timeouts.
#
# Usage: oxide-validator --config config/testnet.toml
#
# This config is for a public testnet with geographically distributed
# validators. Timeouts are tuned for WAN RTT (~30-100ms), and the block
# budget is larger to stress-test the chain.

[network]
# Listen on all interfaces for a public testnet.
listen_addr = "0.0.0.0:9000"
# Peer addresses — replace with actual testnet peer addresses.
# These are placeholders; the real testnet config is generated by the
# deploy tooling.
peers = [
    "peer1.testnet.oxide.dev:9000",
    "peer2.testnet.oxide.dev:9000",
    "peer3.testnet.oxide.dev:9000",
]
# Longer connect timeout for WAN.
connect_timeout_secs = 10
# Longer read timeout for WAN connections.
read_timeout_secs = 60
# 16 MiB max message size.
max_message_bytes = 16777216

[consensus]
# oxideBFT for the testnet.
engine = "oxidebft"
# 3s base timeout — accommodates WAN RTT + vote aggregation.
base_timeout_ms = 3000
# 60s max timeout — generous for sustained network issues.
max_timeout_ms = 60000
# 4 MiB max block size — larger for testnet stress testing.
max_block_bytes = 4194304
# 2 billion gas max block gas.
max_block_gas = 2000000000

[executor]
# 50k mempool entries — larger for testnet load.
max_mempool_entries = 50000
# Use parallel execution for batches >= 100 txs.
parallel_threshold = 100

[genesis]
# 1 trillion genesis balance per sender.
genesis_balance = 1000000000000
# 64 pre-funded sender addresses.
num_prefunded_senders = 64
# 4 validators (testnet starts small).
num_validators = 4
# Base TCP port for the testnet.
base_port = 9000
