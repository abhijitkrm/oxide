# Oxide mainnet configuration — intended production settings.
#
# Status: `oxide-validator --config config/mainnet.toml` runs a
# single-node consensus instance and ignores the `[network]`
# peering settings — a dedicated production validator binary does
# not exist yet. `oxide-devnet` runs the multi-node path: it
# derives peer endpoints from the genesis committee's staking
# addresses (overridable with repeated `--peer` flags), so it does
# not read `[network].peers` either. See
# docs/production-readiness.md for the open production networking
# items.
#
# Timeouts are tuned for global WAN, block budget is conservative
# for stability, and mempool is large for high throughput.
#
# WARNING: This config has placeholder peer addresses. The real
# mainnet config is generated by the deploy tooling with the actual
# genesis validator set.

[network]
# Listen on all interfaces for mainnet.
listen_addr = "0.0.0.0:9000"
# Peer addresses — replace with actual mainnet peer addresses.
# These are placeholders; the real mainnet config is generated by the
# deploy tooling.
peers = [
    # "peer1.mainnet.oxide.dev:9000",
    # "peer2.mainnet.oxide.dev:9000",
    # "peer3.mainnet.oxide.dev:9000",
    # ...
]
# 15s connect timeout — generous for global WAN.
connect_timeout_secs = 15
# 120s read timeout — very generous for sustained network issues.
read_timeout_secs = 120
# 16 MiB max message size.
max_message_bytes = 16777216

[consensus]
# oxideBFT for mainnet.
engine = "oxidebft"
# 5s base timeout — accommodates global WAN RTT + vote aggregation.
base_timeout_ms = 5000
# 120s max timeout — hard cap for backoff during network partitions.
max_timeout_ms = 120000
# 2 MiB max block size — conservative for mainnet stability.
max_block_bytes = 2097152
# 1 billion gas max block gas — conservative for mainnet.
max_block_gas = 1000000000

[executor]
# 100k mempool entries — large for mainnet throughput.
max_mempool_entries = 100000
# Use parallel execution for batches >= 100 txs.
parallel_threshold = 100
# Minimum fee (base units) for native-module transactions — a
# non-zero floor is required on any externally reachable bind;
# 0 lets anyone spam the mempool and order books for free.
min_fee = 1

[rpc]
# Validator RPC stays loopback — validators should not serve public
# RPC (see docs/divergence-runbook.md); front-ends sit behind a
# dedicated RPC node instead.
listen_addr = "127.0.0.1:8545"
# Placeholder chain ID — the deploy tooling assigns the production
# value. It must NOT be a public Ethereum-network ID (1, 5, 17000,
# 11155111, 10, 56, 137, 8453, 42161, 43114): EIP-155 binds the ID
# into every signature, so reusing one makes transactions replayable
# across the two chains. The startup gate refuses those IDs on
# externally reachable binds.
chain_id = 31338
# 1 gwei base fee.
base_fee = 1000000000

[genesis]
# 1 trillion genesis balance per sender.
genesis_balance = 1000000000000
# 128 pre-funded sender addresses.
num_prefunded_senders = 128
# Number of genesis validators — set by the deploy tooling.
num_validators = 4
# Base TCP port for mainnet.
base_port = 9000
