# CI gates for every PR and push to main.
# Mirrors AGENTS.md "Commands" and the skills in .devin/skills/:
# fmt + clippy + test are hard gates; cargo-deny runs once deps exist.

name: ci

# CI is disabled: no automatic triggers. Run manually from the Actions
# tab. To re-enable, restore:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches rust-toolchain.toml — bump both together. The file
      # already pins the channel; the explicit ref keeps the runner
      # deterministic even if rustup shim behavior differs.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        # The ubuntu-latest runner has 7GB RAM but no swap. Linking
        # heavy crates (revm, alloy, arkworks) can exhaust memory and
        # cause `ld` to crash with SIGBUS. A 4GB swap file prevents
        # this without slowing down the normal case.
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        # --locked: CI builds the committed dependency graph, not
        # whatever semver resolution happens to produce today.
        run: cargo clippy --workspace --all-targets --locked --features storage/redb,storage/rocksdb,storage/mdbx
      - name: Test
        # Feature-gated conformance tests (redb, RocksDB, MDBX) must
        # run on every PR — a regression in an adapter would otherwise
        # land unnoticed (audit session 24 gap 4).
        run: cargo test --workspace --all-targets --locked --features storage/redb,storage/rocksdb,storage/mdbx

  quality-macos:
    name: clippy + test (macOS)
    # The ubuntu job never compiles `cfg(not(target_os = "linux"))`
    # code — the non-Linux CPU-pinning stub, the WAL's
    # write+`sync_data` durability path, `F_FULLFSYNC`-backed fsyncs.
    # A lint error in the pin stub reached main this way, and
    # development happens on macOS. Default features only: the
    # optional storage engines (RocksDB, MDBX) are Linux deployment
    # targets and their native builds are covered by the ubuntu job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked

  msrv:
    name: msrv (rust-version floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The manifest's advertised minimum — revm 42 sets the real
      # floor at 1.91. If a dependency bump raises its own MSRV,
      # this job fails and forces `rust-version` up with it — the
      # number can never silently drift below reality again.
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace at advertised MSRV
        # `+1.91` (not the default) — rust-toolchain.toml pins the
        # repo toolchain at 1.98.1 and would silently override this
        # job's selection. The explicit toolchain arg beats the file.
        run: cargo +1.91 check --workspace --all-targets --locked

  supply-chain:
    name: cargo-deny + dep-age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Dependency release-age gate
        # AGENTS.md requires every dependency version to be ≥7 days
        # old — fresh releases are unvetted and supply-chain attacks
        # are usually yanked within days. The script checks every
        # registry package in Cargo.lock against crates.io; a dep
        # bump to a too-new version fails this job.
        run: python3 scripts/check-dep-age.py

  spec:
    name: TLC model check (oxideBFT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned tla2tools
        # Pinned version + sha256: the model checker is a
        # verification dependency — it gets the same supply-chain
        # treatment as Cargo deps (release is from 2024-08).
        run: |
          curl -sSfL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: TLC seeded simulation over the hunt config
        # Exhaustive checking of even the smallest interesting bound
        # is hours (the state space explodes past depth ~10), so the
        # PR gate is a seeded random simulation: 20k behaviors × 40
        # steps over the hunt config — ~16M states evaluated against
        # all six safety invariants in ~1 minute on a laptop. The
        # fixed seed makes the sampled paths reproducible; a spec
        # change that alters enabledness shifts the sample, which is
        # expected — the nightly job covers the deeper exhaustive
        # pass.
        working-directory: spec/oxidebft
        run: >
          java -XX:+UseParallelGC -Xmx4g
          -cp /tmp/tla2tools.jar tlc2.TLC
          -workers auto -seed 424242
          -simulate num=20000 -depth 40
          -config OxideBftSmall.cfg OxideBft.tla
