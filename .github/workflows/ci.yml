# CI gates for every PR and push to main.
# Mirrors AGENTS.md "Commands" and the skills in .devin/skills/:
# fmt + clippy + test are hard gates; cargo-deny runs once deps exist.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --features storage/redb,storage/rocksdb,storage/mdbx
      - name: Test
        # Feature-gated conformance tests (redb, RocksDB, MDBX) must
        # run on every PR — a regression in an adapter would otherwise
        # land unnoticed (audit session 24 gap 4).
        run: cargo test --workspace --all-targets --features storage/redb,storage/rocksdb,storage/mdbx

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
