# Nightly CI: long-running simulations, throughput tests, and fuzz.
# Keeps PR CI fast while catching performance regressions and fuzz
# failures regularly. Source: AGENTS.md "Commands" + testing-standards
# skill (layer 4: deterministic simulation, layer 5: fuzz).

name: nightly

on:
  schedule:
    # 05:00 UTC daily — off-peak for US/EU dev cycles.
    - cron: "0 5 * * *"
  workflow_dispatch: # manual trigger for debugging

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  throughput-sims:
    name: throughput simulations (release, --ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        # See ci.yml for rationale.
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Run ignored throughput simulations
        # Feature-gated conformance tests (redb, RocksDB, MDBX) are
        # included so adapter regressions are caught nightly too
        # (audit session 24 gap 4).
        run: |
          cargo test --release --workspace --all-targets \
            --features storage/redb,storage/rocksdb,storage/mdbx -- \
            --ignored --nocapture --test-threads=1
      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: throughput-sim-output
          path: |
            target/release/deps/*.log
            target/release/deps/*.out

  fuzz:
    name: fuzz targets (bounded budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        # See ci.yml for rationale.
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz targets (5 min each)
        run: |
          # Run each fuzz target for 5 minutes (300s). This is a
          # bounded budget — not exhaustive, but catches regressions
          # in decoders and journal/MMR handling.
          for target in codec-decode journal-replay mmr-proof-verify types-decode consensus-msg evm-execute; do
            echo "=== Fuzzing $target ==="
            cargo +nightly fuzz run "$target" -- -max_total_time=300
          done
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  audit:
    name: cargo audit (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
