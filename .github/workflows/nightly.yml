# Nightly CI: long-running simulations, throughput tests, and fuzz.
# Keeps PR CI fast while catching performance regressions and fuzz
# failures regularly. Source: AGENTS.md "Commands" + testing-standards
# skill (layer 4: deterministic simulation, layer 5: fuzz).

name: nightly

on:
  schedule:
    # 05:00 UTC daily — off-peak for US/EU dev cycles.
    - cron: "0 5 * * *"
  workflow_dispatch: # manual trigger for debugging

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  throughput-sims:
    name: throughput simulations (release, --ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches rust-toolchain.toml — bump both together.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        # See ci.yml for rationale.
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Run ignored throughput simulations
        # Feature-gated conformance tests (redb, RocksDB, MDBX) are
        # included so adapter regressions are caught nightly too
        # (audit session 24 gap 4).
        run: |
          cargo test --release --workspace --all-targets --locked \
            --features storage/redb,storage/rocksdb,storage/mdbx -- \
            --ignored --nocapture --test-threads=1
      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: throughput-sim-output
          path: |
            target/release/deps/*.log
            target/release/deps/*.out

  fuzz:
    name: fuzz targets (bounded budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        # See ci.yml for rationale.
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz targets (10 min each)
        run: |
          # Each of the 10 targets gets a 10-minute soak against the
          # committed corpus (fuzz/corpus/<target>) — the corpus is
          # checked in so coverage accretes across runs instead of
          # starting cold. `-rss_limit_mb` keeps an OOM-prone decode
          # path from starving the runner; a genuine OOM bug still
          # fails the job via the artifact + nonzero exit.
          for target in codec-decode consensus-msg evm-execute exchange-settlement journal-replay mmr-proof-verify sync-decode trading-engine trading-order-validate types-decode; do
            echo "=== Fuzzing $target ==="
            cargo +nightly fuzz run "$target" -- -max_total_time=600 -rss_limit_mb=4096 -timeout=25
          done
      - name: Upload fuzz artifacts and corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/

  audit:
    name: cargo audit (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches rust-toolchain.toml — bump both together.
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  benchmarks:
    name: benchmark gates (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches rust-toolchain.toml — bump both together.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Add swap space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - name: Run criterion benchmarks
        # Run the hot-path benchmarks to track performance
        # regressions. Criterion reports regressions
        # automatically on re-runs by comparing against
        # target/criterion baselines. The throughput gate
        # assertions in trading_throughput.rs enforce the
        # plan.md §13 Phase 3 gates (≥1M ops/s raw engine,
        # ≥100k ops/s exchange settlement).
        run: |
          cargo bench --workspace --locked --features storage/redb,storage/rocksdb,storage/mdbx
      - name: Run throughput gate tests
        # Run the throughput gate tests with assertions that
        # enforce the plan.md §13 Phase 3 gates.
        run: |
          THROUGHPUT_TRADES=1_000_000 cargo test --release --workspace --locked \
            --features storage/redb,storage/rocksdb,storage/mdbx -- \
            --ignored --nocapture --test-threads=1 trading_throughput_smoke
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: target/criterion/
