[package]
name = "oxide-fuzz"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

# cargo-fuzz requires nightly and its own build graph. Run with:
#   cargo +nightly fuzz run <target> -- -max_total_time=600
# from this directory. NOT a workspace member (see root Cargo.toml).
# The empty [workspace] table keeps this crate out of the root workspace
# so it builds with its own (nightly) toolchain and dependency graph.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
codec = { path = "../crates/codec" }
primitives = { path = "../crates/primitives" }
storage = { path = "../crates/storage" }
types = { path = "../crates/types" }
executor = { path = "../crates/executor" }
evm = { path = "../modules/evm" }
exchange = { path = "../modules/exchange" }
framework = { path = "../modules/framework" }
crypto = { path = "../crates/crypto", features = ["dev-identities"] }
p2p = { path = "../crates/p2p" }
mempool = { path = "../crates/mempool" }
trading = { path = "../crates/trading" }
# alloy-primitives: the same B256/Address/U256 types revm re-exports
# (evm pins revm 42, whose primitives are alloy-primitives 1.x).
# Needed so fuzz targets can build signed EVM txs without taking a
# direct dependency on revm itself.
alloy-primitives = { version = "1.7.2", features = ["std"] }

[[bin]]
name = "codec-decode"
path = "fuzz_targets/codec_decode.rs"
test = false
doc = false

[[bin]]
name = "journal-replay"
path = "fuzz_targets/journal_replay.rs"
test = false
doc = false

[[bin]]
name = "mmr-proof-verify"
path = "fuzz_targets/mmr_proof_verify.rs"
test = false
doc = false

[[bin]]
name = "types-decode"
path = "fuzz_targets/types_decode.rs"
test = false
doc = false

[[bin]]
name = "consensus-msg"
path = "fuzz_targets/consensus_msg.rs"
test = false
