\* Hunt config: quorum-atomic votes + evidence-only view movement.
\* Reaches deep protocol states fast; a violation found here is checked
\* against the full-fidelity model by rerunning with both flags TRUE.
SPECIFICATION Spec
CONSTANTS
    N              = 4
    Quorum         = 3
    Byzantine      = {3}
    MaxView        = 4
    MaxHeight      = 3
    MaxVariants    = 2
    IndividualVotes = FALSE
    FreeAdvance    = FALSE
INVARIANTS
    InvType
    InvOneVotePerView
    InvQCUniqueness
    InvHeightConflict
    InvSingleChain
    InvNoGap
CHECK_DEADLOCK FALSE
