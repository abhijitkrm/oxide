\* Smoke config: the smallest instance that still exercises every
\* safety-relevant rule — two-chain commits, TC lock release,
\* equivocation — while staying exhaustively checkable in CI time.
\* n=4/f=1, atomic quorum votes, no free advance: a violation here
\* is replayed against OxideBft.cfg/OxideBftSmall.cfg for triage.
SPECIFICATION Spec
CONSTANTS
    N              = 4
    Quorum         = 3
    Byzantine      = {3}
    MaxView        = 3
    MaxHeight      = 2
    MaxVariants    = 1
    IndividualVotes = FALSE
    FreeAdvance    = FALSE
INVARIANTS
    InvType
    InvOneVotePerView
    InvQCUniqueness
    InvHeightConflict
    InvSingleChain
    InvNoGap
CHECK_DEADLOCK FALSE
